<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="color-scheme" content="light dark"/>
<title>HONGUI 临时邮箱 · mail.hongspaces.com</title>
<style>
:root{
  --bg0:#dce9f4;--bg1:#eef4ea;--ink:#0F172A;--muted:#475569;
  --accent:#4F8CFF;--accent-2:#FF9A62;--mint:#34D3B5;--accent-p:#8B7CFF;
  --glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.88);
  --line:rgba(255,255,255,.72);--line-dim:rgba(15,23,42,.10);
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 16px 40px -16px rgba(30,50,110,.28),0 2px 8px rgba(30,50,110,.08);
  --blur:22px;--radius:24px;--sans:Inter,"SF Pro Display",-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Segoe UI","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --bg0:#0B1220;--bg1:#151C2C;--ink:#E8EEF8;--muted:#A8B4C8;
  --accent:#7BA8FF;--accent-2:#FFB087;--mint:#5EE0C5;--accent-p:#B4A8FF;
  --glass:rgba(18,24,40,.55);--glass-strong:rgba(14,20,34,.90);
  --line:rgba(255,255,255,.14);--line-dim:rgba(255,255,255,.10);
  --shadow:0 1px 0 rgba(255,255,255,.08) inset,0 18px 48px -18px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--sans);color:var(--ink);background:
  radial-gradient(1200px 600px at 10% -10%,rgba(79,140,255,.28),transparent 60%),
  radial-gradient(900px 500px at 100% 0%,rgba(255,154,98,.22),transparent 55%),
  radial-gradient(800px 500px at 50% 100%,rgba(52,211,181,.16),transparent 50%),
  linear-gradient(165deg,var(--bg0),var(--bg1));}
body{padding:24px 16px 48px}
.wrap{max-width:920px;margin:0 auto;display:grid;gap:18px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:780;letter-spacing:.04em;font-size:15px;opacity:.9}
.logo b{background:linear-gradient(120deg,var(--accent),var(--accent-p),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);color:var(--muted)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(var(--blur)) saturate(170%);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);padding:22px}
.hero h1{margin:0 0 6px;font-size:clamp(22px,4vw,30px);letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.addr-box{margin-top:18px;display:grid;gap:12px}
.addr-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-radius:18px;border:1px solid var(--line-dim);background:var(--glass-strong)}
.addr{flex:1 1 220px;font-family:var(--mono);font-size:clamp(14px,2.6vw,18px);word-break:break-all;font-weight:600}
.domain{color:var(--muted);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button{appearance:none;border:1px solid var(--line);background:var(--glass-strong);color:var(--ink);border-radius:999px;padding:10px 16px;font:600 13px/1 var(--sans);cursor:pointer;transition:transform .15s ease,box-shadow .15s,background .15s}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-p));color:#fff;border-color:transparent;box-shadow:0 8px 22px -10px rgba(79,140,255,.7)}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.status{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--muted);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(52,211,181,.55);animation:pulse 1.8s infinite}
.dot.warn{background:var(--accent-2);animation:none}
.dot.off{background:#94a3b8;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,181,.5)}70%{box-shadow:0 0 0 10px rgba(52,211,181,0)}100%{box-shadow:0 0 0 0 rgba(52,211,181,0)}}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.panel-title h2{margin:0;font-size:16px}
.muted{color:var(--muted);font-size:12px}
.list{display:grid;gap:8px;min-height:220px;max-height:520px;overflow:auto}
.item{text-align:left;width:100%;border-radius:16px;padding:14px 16px;border:1px solid var(--line-dim);background:rgba(255,255,255,.28);cursor:pointer}
html[data-theme="dark"] .item{background:rgba(255,255,255,.04)}
.item.active{outline:2px solid var(--accent);background:var(--glass-strong)}
.item .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.item .from{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.item .when{font-size:12px;color:var(--muted);flex:0 0 auto;white-space:nowrap}
.empty{display:grid;place-items:center;min-height:220px;color:var(--muted);font-size:14px;text-align:center;padding:24px;border:1px dashed var(--line-dim);border-radius:18px}
.reader{display:grid;gap:10px;min-height:280px}
.reader .head{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line-dim)}
.reader .subj{font-size:18px;font-weight:700}
.reader .meta{font-size:12px;color:var(--muted);display:grid;gap:2px}
.body-frame{border:1px solid var(--line-dim);border-radius:16px;background:#fff;color:#111;min-height:200px;max-height:480px;overflow:auto;padding:14px;font-size:14px;line-height:1.55}
.body-frame img{max-width:100%;height:auto;border-radius:8px;display:inline-block;vertical-align:middle}
.body-frame table{max-width:100%;border-collapse:collapse}
.body-frame a{color:var(--accent)}
html[data-theme="dark"] .body-frame{background:#0f1522;color:#e8eef8}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.field{display:grid;gap:6px;margin-top:10px}
.field label{font-size:12px;color:var(--muted)}
.field input{border:1px solid var(--line-dim);border-radius:14px;padding:11px 14px;font:500 14px/1.2 var(--sans);background:var(--glass-strong);color:var(--ink);outline:none}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.18)}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--glass-strong);border:1px solid var(--line);backdrop-filter:blur(16px);padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s ease;font-size:13px;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:8px}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo"><b>HONGUI</b> MAIL</div>
    <div class="pill" id="ttlPill">邮件保留约 24 小时</div>
  </div>
  <section class="card hero">
    <h1>临时邮箱</h1>
    <p>即开即用 · 网页直读 · 可选 PIN 保护 · 不转发到外部邮箱。适合验证码与一次性注册。</p>
    <div class="addr-box">
      <div class="addr-row">
        <div class="addr"><span id="local">…</span><span class="domain">@hongspaces.com</span></div>
        <div class="actions">
          <button class="primary" id="btnCopy" type="button">复制</button>
          <button id="btnNew" type="button">新建</button>
          <button id="btnCustom" type="button">自定义</button>
        </div>
      </div>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">正在监听收件…</span></div>
      <div class="field" id="customRow" hidden>
        <label>自定义前缀（字母数字，3–32 位）</label>
        <div class="actions">
          <input id="customInput" maxlength="32" placeholder="例如 myname" style="flex:1;min-width:160px"/>
          <button class="primary" id="btnApplyCustom" type="button">使用</button>
        </div>
      </div>
      <div class="field">
        <label>可选访问 PIN（保护此邮箱，他人无法打开）</label>
        <div class="actions">
          <input id="pinInput" type="password" maxlength="64" placeholder="留空则公开可读" autocomplete="new-password" style="flex:1;min-width:160px"/>
          <button id="btnSetPin" type="button">设置 PIN</button>
          <button id="btnUnlock" type="button">解锁</button>
        </div>
      </div>
      <p class="hint" id="ttlHint">保留名（admin / postmaster / mail 等）不可用。一般邮箱闲置约 24 小时后自动清理；前缀以 Hong 开头（不区分大小写）的邮箱永久保留。不会列出全部邮箱。</p>
    </div>
  </section>
  <section class="grid">
    <div class="card">
      <div class="panel-title"><h2>收件箱</h2><span class="muted" id="countLabel">0 封</span></div>
      <div class="list" id="list"><div class="empty">等待邮件到达…</div></div>
      <div class="tools">
        <button id="btnRefresh" type="button">刷新</button>
        <button id="btnDelAll" type="button">清空收件箱</button>
      </div>
    </div>
    <div class="card">
      <div class="panel-title"><h2>邮件内容</h2><span class="muted">点击左侧打开</span></div>
      <div class="reader" id="reader"><div class="empty">选择一封邮件查看</div></div>
    </div>
  </section>
  <div class="footer">mail.hongspaces.com · 与 <a href="https://hongspaces.com">hongspaces.com</a> 同源玻璃风格</div>
</div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
